name: Build FetchX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FetchX project
        run: unzip -q fetchx-apk-project-simple-output.zip -d project

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Generate Android icons
        working-directory: project
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FetchX-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
